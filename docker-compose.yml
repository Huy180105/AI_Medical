services:
  medical_ai_app:
    build: .
    image: medfusion-cxr:latest
    container_name: medical_ai_capstone
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # Source code and web UI bind-mounted for live development & hot-reloading
      - ./main.py:/app/main.py:ro
      - ./src:/app/src:ro
      - ./web:/app/web:ro
      # Pretrained DenseNet-121 NIH-14, XGBoost/TreeSHAP artifacts, PhoBERT NER weights
      - ./models:/app/models:ro
      # E1 NIH-14 benchmark reports (read by /api/v1/multimodal/nih-benchmark)
      - ./reports:/app/reports:ro
      # Writable outputs + HuggingFace cache persisted across restarts
      - ./output:/app/output
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/treatment/benchmark"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

volumes:
  hf_cache:
