services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_DSN: postgresql://mlflow:mlflow@postgres:5432/mlflow
    depends_on:
      - redis
      - mlflow
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  metrics:
    build: .
    command: ["uvicorn", "src.mlops.metrics_api:create_metrics_app", "--factory", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://mlflow:mlflow@postgres:5432/mlflow
      METRICS_LATENCY_PROBE_URL: http://api:8000/health
    depends_on:
      - api
      - redis
      - postgres

  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://mlflow:mlflow@postgres:5432/mlflow
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
  mlflow-artifacts:
